name: Python checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,studio,web-test]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip check
      - run: puzzlepress validate books/automotive
      - run: puzzlepress inspect books/automotive
      - run: puzzlepress puzzle generate --width 10 --height 8 --seed 2026 --word ENGINE --word CLUTCH --word PISTON --solution
      - run: puzzlepress validate books/garden-demo
      - run: puzzlepress puzzle batch books/garden-demo --json
      - run: puzzlepress validate books/composition-demo
      - run: puzzlepress book plan books/composition-demo --json

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ".[studio]"
      - run: npm ci
        working-directory: studio
      - run: npm run check
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - run: npx playwright install --with-deps chromium
        working-directory: studio
      - run: npm run test:browser
        working-directory: studio
