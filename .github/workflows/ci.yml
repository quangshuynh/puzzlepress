name: Python checks
on: [push, pull_request]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,studio,web-test]"
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      - run: python -m pip check
      - run: puzzlepress validate books/automotive
      - run: puzzlepress inspect books/automotive
      - run: puzzlepress puzzle generate --width 10 --height 8 --seed 2026 --word ENGINE --word CLUTCH --word PISTON --solution
      - run: puzzlepress validate books/garden-demo
      - run: puzzlepress puzzle batch books/garden-demo --json
      - run: puzzlepress validate books/composition-demo
      - run: puzzlepress book plan books/composition-demo --json

  print:
    # One interior build per OS; the PDF unit tests already run in every matrix entry.
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: puzzlepress validate books/composition-demo
      - run: puzzlepress book plan books/composition-demo
      - run: puzzlepress book build books/composition-demo --output interior-out --json
      - name: Verify the written interior independently
        run: |
          python - <<'EOF'
          import hashlib, json, pathlib
          from pypdf import PdfReader
          out = pathlib.Path("interior-out")
          manifest = json.loads((out / "interior.json").read_text())
          data = (out / "interior.pdf").read_bytes()
          assert hashlib.sha256(data).hexdigest() == manifest["pdf"]["sha256"]
          reader = PdfReader(out / "interior.pdf", strict=True)
          assert len(reader.pages) == manifest["page_count"] == 11
          assert all([float(v) for v in p.mediabox] == [0, 0, 612, 792] for p in reader.pages)
          assert not any("/Annots" in p for p in reader.pages) and not reader.outline
          EOF
      - run: puzzlepress book build books/composition-demo --output interior-again
      - run: cmp interior-out/interior.pdf interior-again/interior.pdf

  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -e ".[studio]"
      - run: npm ci
        working-directory: studio
      - run: npm run check
        working-directory: studio
      - run: npm test
        working-directory: studio
      - run: npm run build
        working-directory: studio
      - run: npx playwright install --with-deps chromium
        working-directory: studio
      - run: npm run test:browser
        working-directory: studio
