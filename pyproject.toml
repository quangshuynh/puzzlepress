[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "puzzlepress"
version = "0.1.0"
description = "Deterministic foundations for structured puzzle-book publishing"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PyYAML>=6.0.2,<7",
    "reportlab>=5.0.1,<5.1",
    "pypdf>=6.19,<7",
    "pillow>=12,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "types-PyYAML>=6,<7",
    "types-reportlab>=5,<6",
]
studio = ["fastapi>=0.135,<0.136", "uvicorn>=0.34,<1", "pypdfium2>=5.14,<6"]
web-test = ["httpx>=0.28,<1"]

[project.scripts]
puzzlepress = "puzzlepress.cli:main"
puzzlepress-studio = "puzzlepress.studio.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
puzzlepress = ["py.typed", "interior/fonts/*", "cover/fonts/*", "cover/templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/puzzlepress"]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information; it is used only for Studio page previews.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
