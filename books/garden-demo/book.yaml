schema_version: 1
book:
  id: garden-demo
  title: Garden Word Searches
  language: en
build:
  seed: 2026
word_search:
  banks:
    - id: garden
      entries:
        - {id: rose, display: ROSE}
        - {id: lily, display: LILY}
        - {id: iris, display: IRIS}
        - {id: mint, display: MINT}
        - {id: sage, display: SAGE}
        - {id: thyme, display: THYME}
  profiles:
    - id: gentle
      width: 10
      height: 8
      directions: [right, down]
    - id: varied
      width: 10
      height: 10
      directions: [right, left, down, up, down-right, down-left, up-right, up-left]
  puzzles:
    - id: flowers
      title: In the Flower Bed
      theme: Flowers
      bank: garden
      target_ids: [rose, lily, iris]
      difficulty: gentle
    - id: herbs
      title: The Herb Garden
      theme: Herbs
      bank: garden
      target_ids: [mint, sage, thyme]
      difficulty: varied
  quality:
    max_word_reuse: 2
    target_similarity_threshold: 0.8
    grid_similarity_threshold: 0.9
    prohibited_words: []
output:
  directory: ../../build/garden-demo
