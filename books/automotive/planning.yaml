# A DEMONSTRATION plan for the upcoming automotive book (docs/book-planning.md).
# It is not the production book and contains no market research: no comparable
# books are recorded until a person has read and cited them. Audiences are
# working assumptions. The candidate vocabulary was drafted with an AI model for
# this demonstration and is recorded as ai_generated. KDP facts are cited from
# PuzzlePress's own recorded provenance and marked unverified for this book.
# Nothing here is approved. book.yaml beside it is untouched by planning.
planning_version: 1
concept:
  summary: >-
    An adult word-search book about how cars work and how people look after them:
    engines, maintenance, tools, vehicle systems, motorsport, automotive history and
    driving culture, each puzzle built from factual, generic automotive terms.
  subject: Automotive technology, maintenance and car culture
  reader_experience: >-
    Relaxed solving with vocabulary a car enthusiast recognizes; difficulty rises
    gently from warm-up grids to larger challenge grids.
  scope: Seven themes on vehicle technology, care and culture. No brand or model names.
positioning:
  primary_audience: Adult car enthusiasts (working assumption, not validated)
  secondary_audience: Automotive students and hobby mechanics (candidate, not validated)
  candidate_audiences:
    - Car enthusiasts
    - Mechanics
    - Automotive students
    - General vehicle hobbyists
    - Adults who enjoy themed word searches
  familiarity: enthusiast
  tone: Knowledgeable and friendly, with plain factual theme titles
  use_case: Leisure solving at home or while travelling
  main_benefit: Themed puzzles built from real automotive vocabulary rather than general car words.
  differentiation: >-
    Hypothesis to test: themes organized around how vehicles work and are maintained,
    using technical terms, rather than a general mix of car-related words.
  evidence:
    - r-audience-hypothesis
  claims: []
structure:
  puzzle_type: word_search
  target_puzzles: 60
  print_profile: null
  solutions: end
  solutions_per_page: 2
  front_matter_pages: 3
  back_matter_pages: 1
difficulty:
  strategy: gradual
  levels:
    - id: warm-up
      label: Warm-up
      width: 13
      height: 13
      directions: [right, down, down-right]
      words: {min: 10, max: 12}
    - id: standard
      label: Standard
      width: 15
      height: 15
      directions: [right, down, down-right, up-right]
      words: {min: 12, max: 15}
    - id: challenge
      label: Challenge
      width: 17
      height: 17
      directions: [right, left, down, up, down-right, down-left, up-right, up-left]
      words: {min: 15, max: 18}
