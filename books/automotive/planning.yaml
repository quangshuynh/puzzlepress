constraints:
  min_letters: 4
  max_letters: 15
  max_word_reuse: 2
  prohibited_words: []
  notes:
    - Generic terms only. No brand, model, team or driver names.
    - Factual terminology. No slang that could read as offensive.
questions:
  - id: q-audience
    question: Should the primary audience be adult car enthusiasts, or automotive students?
    blocking: true
  - id: q-comparables
    question: >-
      Which comparable automotive word-search books exist, and what puzzle counts,
      page counts and trim sizes do they use? Record only books a person has read.
    blocking: true
  - id: q-puzzle-cap
    question: >-
      Projects hold at most 20 puzzles today. Raise the cap for a 60-puzzle book in
      production, or plan a smaller first edition?
    blocking: true
  - id: q-paper
    question: White or cream interior paper?
research:
  - id: r-kdp-minimum
    question: q-puzzle-cap
    observation: KDP paperbacks need at least 24 pages.
    evidence: unverified_source
    source:
      citation: >-
        KDP help, Paperback Submission Guidelines, as recorded in PuzzlePress
        docs/cover.md (KDP provenance, read 2026-10-07). Not re-read for this book.
      type: official
    relevance: Even a 20-puzzle first edition clears the minimum with solutions and front matter.
  - id: r-spine-text
    observation: >-
      Spine text needs at least 80 pages under the stricter reading of KDP's wording
      ("more than 79" and "at least 79").
    evidence: unverified_source
    source:
      citation: >-
        KDP help, Create a Paperback Cover, as recorded in PuzzlePress docs/cover.md
        (KDP provenance, read 2026-10-07). Not re-read for this book.
      type: official
    relevance: Sixty puzzles with two solutions a page are estimated near 95 pages.
    decision: Plan two solutions a page so a full book can carry spine text.
  - id: r-audience-hypothesis
    question: q-audience
    observation: Car enthusiasts may prefer technical vocabulary to general car words.
    evidence: hypothesis
    confidence: low
    decision: Work from enthusiasts as the primary audience until this is researched.
  - id: r-generic-terms
    observation: >-
      Brand, model and team names may be trademarks; generic technical terms avoid
      that question entirely.
    evidence: preference
    decision: Use generic terms only.
comparables: []
approval: null
