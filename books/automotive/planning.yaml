# The plan for the automotive production book (docs/book-planning.md and
# docs/automotive-production.md). It contains no market research: no comparable
# books are recorded until a person has read and cited them, so the plan stays in
# needs_research. Audiences are the author's working defaults, not validated. All
# vocabulary, puzzle titles and word lists were drafted with an AI model (the 184
# Interval 11 candidates and the words marked "Added in Interval 12") and are
# recorded as ai_generated; no person has reviewed them yet. KDP facts are cited
# from PuzzlePress's own recorded provenance. Nothing here is approved, and
# book.yaml beside it is the production source, which planning never writes.
planning_version: 1
concept:
  summary: >-
    An adult word-search book about how cars work and how people look after them:
    engines, maintenance, tools, vehicle systems, motorsport, automotive history and
    driving culture, each puzzle built from factual, generic automotive terms.
  subject: Automotive technology, maintenance and car culture
  reader_experience: >-
    Relaxed solving with vocabulary a car enthusiast recognizes; difficulty rises
    gently from warm-up grids to larger challenge grids.
  scope: Seven themes on vehicle technology, care and culture. No brand or model names.
positioning:
  primary_audience: Adult car enthusiasts (working assumption, not validated)
  secondary_audience: Automotive students and hobby mechanics (candidate, not validated)
  candidate_audiences:
    - Car enthusiasts
    - Mechanics
    - Automotive students
    - General vehicle hobbyists
    - Adults who enjoy themed word searches
  familiarity: enthusiast
  tone: Knowledgeable and friendly, with plain factual theme titles
  use_case: Leisure solving at home or while travelling
  main_benefit: Themed puzzles built from real automotive vocabulary rather than general car words.
  differentiation: >-
    Hypothesis to test: themes organized around how vehicles work and are maintained,
    using technical terms, rather than a general mix of car-related words.
  evidence:
    - r-audience-hypothesis
  claims: []
structure:
  puzzle_type: word_search
  target_puzzles: 60
  print_profile: paperback-8.5x11
  solutions: end
  solutions_per_page: 2
  front_matter_pages: 3
  back_matter_pages: 1
difficulty:
  strategy: gradual
  levels:
    - id: warm-up
      label: Warm-up
      width: 13
      height: 13
      directions: [right, down, down-right]
      words: {min: 10, max: 12}
    - id: standard
      label: Standard
      width: 15
      height: 15
      directions: [right, down, down-right, up-right]
      words: {min: 12, max: 15}
    - id: challenge
      label: Challenge
      width: 17
      height: 17
      directions: [right, left, down, up, down-right, down-left, up-right, up-left]
      words: {min: 15, max: 18}
themes:
  - id: automotive
    label: Automotive
  - id: engines
    label: Engines & Powertrains
    parent: automotive
    required: true
    puzzles: 10
  - id: maintenance
    label: Maintenance & Repair
    parent: automotive
    required: true
    puzzles: 10
  - id: tools
    label: Tools & Workshop
    parent: automotive
    puzzles: 8
  - id: systems
    label: Vehicle Systems
    parent: automotive
    required: true
    puzzles: 10
  - id: motorsport
    label: Motorsport
    parent: automotive
    puzzles: 8
  - id: history
    label: Automotive History
    parent: automotive
    puzzles: 6
  - id: driving
    label: Driving & Road Culture
    parent: automotive
    puzzles: 8
