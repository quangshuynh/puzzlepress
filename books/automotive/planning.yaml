constraints:
  min_letters: 4
  max_letters: 15
  max_word_reuse: 2
  prohibited_words: []
  notes:
    - Generic terms only. No brand, model, team or driver names.
    - Factual terminology. No slang that could read as offensive.
questions:
  - id: q-audience
    question: Should the primary audience be adult car enthusiasts, or automotive students?
    blocking: true
    resolution: >-
      Author's working default (Interval 12 brief): adult car enthusiasts and automotive
      hobbyists first; automotive students and aspiring mechanics second. An editorial
      choice, not validated market research (r-positioning-default).
  - id: q-comparables
    question: >-
      Which comparable automotive word-search books exist, and what puzzle counts,
      page counts and trim sizes do they use? Record only books a person has read.
    blocking: true
  - id: q-puzzle-cap
    question: >-
      Projects hold at most 20 puzzles today. Raise the cap for a 60-puzzle book in
      production, or plan a smaller first edition?
    blocking: true
    resolution: >-
      Interval 12 raised the project cap to 100 puzzles within a batch work budget
      (docs/automotive-production.md#generator-scaling). The 60-puzzle target stays.
  - id: q-paper
    question: White or cream interior paper?
    resolution: White paper (print profile paperback-8.5x11), the author's production default in the Interval 12 brief.
  - id: q-vocabulary-review
    question: >-
      Has a person reviewed every AI-drafted word list, puzzle title and matter text
      for accuracy and suitability? The content audit lists them
      (docs/automotive-content-audit.md).
research:
  - id: r-kdp-minimum
    question: q-puzzle-cap
    observation: KDP paperbacks need at least 24 pages.
