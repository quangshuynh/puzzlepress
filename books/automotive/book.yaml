# Automotive Word Search: the production book (docs/automotive-production.md).
# Sixty puzzles in seven themes and three levels, planned in planning.yaml beside
# this file. Banks split each theme's vocabulary by section (warm-up and standard,
# then challenge) because six theme pools exceed the 100-entry bank cap. The word
# lists, titles and matter text were drafted with an AI model (provenance in
# planning.yaml); no person has approved them yet. Author, imprint, copyright
# notice, ISBN and the AI disclosure are the author's decisions and stay open.
schema_version: 1
book:
  id: automotive-word-search
  title: Automotive Word Search
  subtitle: 60 Themed Puzzles with Solutions
  description: >-
    Sixty automotive word searches in seven themes and three difficulty levels,
    with solutions.
  language: en-US
build:
  seed: 2026
output:
  directory: ../../build/automotive-word-search
composition:
  front_matter:
    - kind: title_page
    - kind: copyright_page
      text: |-
        Automotive Word Search

        Puzzles generated and checked with PuzzlePress.

        Spelling follows American English. The word lists use general automotive terms; no brand, model, team or driver names appear.

        This book is for entertainment. It is not a repair, maintenance or training manual: follow the vehicle manufacturer's instructions and qualified advice for any work on a vehicle.
    - kind: instructions
      title: How to Use This Book
      text: |-
        Sixty word searches built from the vocabulary of engines, maintenance, tools, vehicle systems, motorsport, automotive history and driving.

        Each puzzle has a title, a theme and a list of words hidden in its grid. Words run in straight lines and never bend. Spaces in multi-word terms are left out of the grid, so SPARK PLUG appears as SPARKPLUG. Words may cross and share letters. Mark each word as you find it.

        The puzzles grow harder through the book, and each puzzle's page number is its puzzle number.

        Warm-up, pages 1 to 20: 13 by 13 grids with 10 or 11 words, reading across, down, or diagonally down to the right.

        Standard, pages 21 to 40: 15 by 15 grids with 13 or 14 words, adding diagonals that read up to the right.

        Challenge, pages 41 to 60: 17 by 17 grids with 16 words, reading in all eight directions, including backwards.

        Solutions begin on page 61, two to a page. Each shows the puzzle's title and page number, with every word outlined in the grid.
  puzzles:
    start: recto
  solutions:
    placement: end
    title: Solutions
    per_page: 2
    start: recto
  back_matter:
    - kind: about
      title: About the Words
      text: |-
        The vocabulary covers how vehicles are built, maintained, raced and driven. Some terms are everyday words; others are workshop or racing language you may be meeting for the first time.

        Spellings follow American English, so the lists use TIRE rather than TYRE and CHECKERED FLAG rather than CHEQUERED FLAG. Hyphenated terms are written as separate words, such as TUNE UP and BLOW OFF VALVE.

        Thank you for solving.
  page_numbers:
    scheme: roman_front_matter
    show_front_matter: false
    show_solutions: true
    show_back_matter: true
